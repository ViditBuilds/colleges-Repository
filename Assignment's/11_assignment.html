
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 11: Accessibility</title>
</head>

<body>
 

    <h2>Accessibility</h2>
    <!-- Skip Link -->
    <a href="#main">Skip to main content</a>

    <br>

    <!-- Navigation -->
    <nav aria-label="Main Navigation">
        <a href="#home">Home</a> <br>

        <a href="#help">Help</a>
    </nav>

    <!-- Main Content -->
    <main id="main">

        <h1>Accessible Page</h1>

        <!-- Image with Alt Text -->
        <img
            id="logo"
            src="image.png"
            alt="College Logo"
            width="200"
            height="180"
        >

        <!-- Close Button -->
        <button type="button"
            aria-label="Close image"
            onclick="document.getElementById('logo').hidden = true">
            X
        </button>

        <br><br>

        <!-- Search Section -->
        <form role="search" aria-label="Website Search">

            <label for="search">Search:</label>

            <input
                type="search"
                id="search"
                name="search"
                aria-label="Search website"
            >

        </form>
 
        
    </main>

</body>

</html>
