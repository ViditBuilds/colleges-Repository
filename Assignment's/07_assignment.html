<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment : 7 </title> 
    <style>
 .nav {
            border: 1px solid green;
            padding: 20px 55px;
        }

        .menu {
            display: flex;
            list-style: none;
            background-color: #333;
            padding: 0;
            margin: 0;
        }

        .menu li {
            color: white;
            padding: 12px 17px;
            cursor: pointer;
        }
    </style>

</head>
<body> 
    <h2>Navigation Menu Using Lists</h2>
    <div class="nav">
        <nav>
            <ul class="menu ">
                <li>Home </li>
                <li> About</li>
                <li> Courses </li>
                <li> Contact </li>
            </ul>
        </nav>
    </div>
</body>
</html>
