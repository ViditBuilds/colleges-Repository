
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment :3</title>

    <style>
        h1 {
            color: darkblue;
        }

        h3 {
            color: green;
        }

        /* Block Elements */
        div:nth-of-type(2) li {
            background-color: lightblue;
            margin-bottom: 4px;
        }

        /* Inline Elements */
        div:nth-of-type(3) li {
            display: inline;
            background-color: lightgreen;
            margin-right: 5px;
        }

        p {
            margin-top: 10px;
        }

        ol {
            padding-left: 25px;
        }

    </style>
</head>

<body>
    <div>
        <h1>Block and Inline Elements</h1>
    </div>

    <div>
        <h3>Block elements:</h3>

        <ol type="1">
            <li>div</li>
            <li>Paragraph</li>
            <li>Headings elements</li>
        </ol>

        <p>These are the blocks elements</p>
    </div>

    <div>
        <h3>Inline Elements</h3>

        <ol type="1">
            <li>Span</li>
            <li>Hyperlink</li>
            <li>Bold</li>
        </ol>

        <p>These are the Inline elements</p>
    </div>

</body>
</html>
