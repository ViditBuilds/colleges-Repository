<body>

    <div class="container">

        <h2>Assignment 18: Mini Project – Accessible Student Admission Page</h2>

        <header>

        </header>

        <main>

            <section>
                <h2>Courses and Fees</h2>

                <table>
                    <caption>Available Courses</caption>

                    <thead>
                        <tr>
                            <th>Course</th>
                            <th>Seats</th>
                            <th>Fees</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr>

            <section>
                <form action="submit.php" method="POST">

                        <select id="course" name="course">
                            <option>B.Tech CSE</option>
                            <option>BCA</option>
                        </select>

                        <br><br>

                        <label for="statement">Statement:</label>
                        <br>

                        <textarea id="statement" name="statement"
                            rows="4" cols="45" required></textarea>

                        <br><br>

                        <button type="submit">Apply</button>

                    </fieldset>
                </form>
            </section>

        </main>

        <br>
